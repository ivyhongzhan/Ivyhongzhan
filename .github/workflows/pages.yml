name: Build and deploy al-folio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Verify recruitment demo in generated site
        run: |
          echo "Source candidate:"
          ls -l assets/recruitment-demo.html _pages/recruitment-demo.html
          echo "Generated matching files:"
          find _site -iname '*recruit*' -print
          echo "Generated site directories:"
          find _site -maxdepth 3 -type d | head -65
          test -s _site/assets/recruitment-demo.html
          test -s _site/assets/recruitment-lens.html
          grep -q 'Recruitment Lens' _site/assets/recruitment-lens.html
          grep -q 'Recruitment management workspace' _site/assets/recruitment-demo.html
          grep -q 'hz-add-person' _site/assets/recruitment-demo.html
          test -s _site/index.html
          test -s _site/research/index.html
          test -s _site/research/masters/index.html
          test -s _site/research/recruitment-system/index.html
          grep -q 'hz-featured-grid' _site/index.html
          grep -q '15 semi-structured interviews' _site/research/masters/index.html
          grep -q 'recruitment-demo.html' _site/index.html
          printf 'Verified generated recruitment demo (%s bytes)\\n' "$(wc -c < _site/assets/recruitment-demo.html)"
          find _site/research -maxdepth 5 -name index.html -print | head -30

      - name: Upload build folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
